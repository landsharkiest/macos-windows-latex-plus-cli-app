<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Stylized T (LaTeX T) -->
  <g transform="translate(256, 256)">
    <!-- T vertical stroke -->
    <rect x="-20" y="-120" width="40" height="180" fill="white" rx="8"/>
    <!-- T horizontal stroke (top) -->
    <rect x="-80" y="-120" width="160" height="35" fill="white" rx="8"/>
    
    <!-- Subscript e with circuit pattern -->
    <g transform="translate(60, -40)">
      <!-- Letter e -->
      <path d="M 0,0 Q -15,-20 0,-40 Q 15,-20 0,0 Z" fill="url(#accentGradient)"/>
      <circle cx="0" cy="-20" r="8" fill="white"/>
      
      <!-- Circuit nodes -->
      <circle cx="-25" cy="-20" r="3" fill="#ffed4e"/>
      <circle cx="25" cy="-20" r="3" fill="#ffed4e"/>
      <line x1="-22" y1="-20" x2="-8" y2="-20" stroke="#ffed4e" stroke-width="2"/>
      <line x1="8" y1="-20" x2="22" y2="-20" stroke="#ffed4e" stroke-width="2"/>
    </g>
    
    <!-- X superscript with AI brain motif -->
    <g transform="translate(100, -90) scale(0.8)">
      <!-- X strokes -->
      <rect x="-25" y="-25" width="50" height="8" fill="url(#accentGradient)" rx="4" transform="rotate(45)"/>
      <rect x="-25" y="-25" width="50" height="8" fill="url(#accentGradient)" rx="4" transform="rotate(-45)"/>
      
      <!-- AI neural connection dots -->
      <circle cx="-18" cy="-18" r="3" fill="white"/>
      <circle cx="18" cy="-18" r="3" fill="white"/>
      <circle cx="-18" cy="18" r="3" fill="white"/>
      <circle cx="18" cy="18" r="3" fill="white"/>
    </g>
    
    <!-- Stylized pen/pencil at bottom -->
    <g transform="translate(0, 90)">
      <!-- Pen body -->
      <path d="M -8,-30 L -8,30 L 0,40 L 8,30 L 8,-30 Z" fill="white"/>
      <!-- Pen tip -->
      <path d="M -8,30 L 0,40 L 8,30 Z" fill="url(#accentGradient)"/>
      <!-- Pen clip (circuit inspired) -->
      <rect x="-2" y="-25" width="4" height="15" fill="url(#accentGradient)" rx="2"/>
      <circle cx="0" cy="-27" r="4" fill="none" stroke="url(#accentGradient)" stroke-width="2"/>
      
      <!-- Document lines beneath pen -->
      <line x1="-40" y1="50" x2="40" y2="50" stroke="white" stroke-width="3" opacity="0.6"/>
      <line x1="-40" y1="60" x2="40" y2="60" stroke="white" stroke-width="3" opacity="0.6"/>
      <line x1="-40" y1="70" x2="20" y2="70" stroke="white" stroke-width="3" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Decorative circuit elements around the edges -->
  <circle cx="80" cy="100" r="4" fill="white" opacity="0.5"/>
  <circle cx="432" cy="120" r="4" fill="white" opacity="0.5"/>
  <circle cx="100" cy="400" r="4" fill="white" opacity="0.5"/>
  <circle cx="420" cy="380" r="4" fill="white" opacity="0.5"/>
  
  <line x1="80" y1="100" x2="120" y2="140" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="432" y1="120" x2="390" y2="160" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>
