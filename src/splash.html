<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LaTeX Plus - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-container {
      width: 500px;
      height: 350px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background particles */
    .splash-container::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: drift 20s linear infinite;
      opacity: 0.5;
    }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .logo-container {
      position: relative;
      z-index: 2;
      animation: logoEntry 0.8s ease-out;
    }

    @keyframes logoEntry {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .logo {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
    }

    .logo svg {
      width: 90px;
      height: 90px;
    }

    .title {
      color: white;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      position: relative;
      z-index: 2;
      animation: fadeIn 0.8s ease-out 0.2s both;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      font-weight: 400;
      position: relative;
      z-index: 2;
      animation: fadeIn 0.8s ease-out 0.4s both;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 0 0 20px 20px;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffed4e);
      animation: loading 2.5s ease-in-out;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    @keyframes loading {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    .version {
      position: absolute;
      bottom: 20px;
      right: 25px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      z-index: 2;
      animation: fadeIn 0.8s ease-out 0.6s both;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <div class="logo">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
            </linearGradient>
          </defs>
          <g transform="translate(256, 256)">
            <rect x="-20" y="-120" width="40" height="180" fill="url(#logoGradient)" rx="8"/>
            <rect x="-80" y="-120" width="160" height="35" fill="url(#logoGradient)" rx="8"/>
            <g transform="translate(60, -40)">
              <path d="M 0,0 Q -15,-20 0,-40 Q 15,-20 0,0 Z" fill="#ffd700"/>
              <circle cx="0" cy="-20" r="8" fill="white"/>
            </g>
            <g transform="translate(100, -90) scale(0.8)">
              <rect x="-25" y="-25" width="50" height="8" fill="#ffd700" rx="4" transform="rotate(45)"/>
              <rect x="-25" y="-25" width="50" height="8" fill="#ffd700" rx="4" transform="rotate(-45)"/>
            </g>
            <g transform="translate(0, 90)">
              <path d="M -8,-30 L -8,30 L 0,40 L 8,30 L 8,-30 Z" fill="url(#logoGradient)"/>
              <path d="M -8,30 L 0,40 L 8,30 Z" fill="#ffd700"/>
              <rect x="-2" y="-25" width="4" height="15" fill="#ffd700" rx="2"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
    <h1 class="title">LaTeX Plus</h1>
    <p class="subtitle">AI-Powered LaTeX Editor</p>
    <div class="version">v1.0.0</div>
    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
  </div>
</body>
</html>
